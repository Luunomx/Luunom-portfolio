<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">BulletinBoard architecture</title>
  <desc id="desc">A React frontend and ASP.NET Core API use MongoDB. Docker Compose is the local path. Images can be published manually to GHCR, Argo CD can deploy the Helm chart to EKS, and External Secrets reads credentials from AWS Secrets Manager.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="security" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#fcd34d"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .section { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; letter-spacing: 1.5px; }
      .box-title { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .box-text { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #dbeafe; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .legend { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1400" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1250" cy="100" r="230" fill="#4f46e5" opacity=".12"/>
  <circle cx="160" cy="790" r="260" fill="#0891b2" opacity=".10"/>

  <text x="70" y="72" class="title">BulletinBoard architecture</text>
  <text x="70" y="104" class="subtitle">A small full-stack demo used to explain containerization, GitOps, secrets and AWS deployment.</text>

  <text x="70" y="164" class="section">APPLICATION</text>
  <text x="490" y="164" class="section">DELIVERY / GITOPS</text>
  <text x="900" y="164" class="section">RUNTIME / AWS</text>

  <g filter="url(#shadow)">
    <rect x="70" y="195" width="270" height="130" rx="18" fill="url(#app)"/>
    <text x="100" y="235" class="box-title">React + Vite</text>
    <text x="100" y="263" class="box-text">simple-fluid-page/</text>
    <text x="100" y="289" class="box-text">Public bulletin board UI</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="380" width="270" height="130" rx="18" fill="url(#app)"/>
    <text x="100" y="420" class="box-title">ASP.NET Core 8 API</text>
    <text x="100" y="448" class="box-text">webapp/</text>
    <text x="100" y="474" class="box-text">GET, POST and DELETE /api/posts</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="565" width="270" height="130" rx="18" fill="#475569"/>
    <text x="100" y="605" class="box-title">MongoDB</text>
    <text x="100" y="633" class="box-text">Posts collection</text>
    <text x="100" y="659" class="box-text">Persistent data in local Compose</text>
  </g>
  <path d="M205 326 L205 374" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M205 511 L205 559" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="223" y="355" class="small">HTTP</text>
  <text x="223" y="540" class="small">MongoDB driver</text>

  <g filter="url(#shadow)">
    <rect x="470" y="195" width="300" height="130" rx="18" fill="#334155"/>
    <text x="500" y="235" class="box-title">GitHub Actions (dry run)</text>
    <text x="500" y="263" class="box-text">Checks, builds and previews</text>
    <text x="500" y="289" class="box-text">Manual only; no push or deploy</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="470" y="380" width="300" height="130" rx="18" fill="url(#platform)"/>
    <text x="500" y="420" class="box-title">GHCR</text>
    <text x="500" y="448" class="box-text">Backend and frontend images</text>
    <text x="500" y="474" class="box-text">Tagged with the commit SHA</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="470" y="565" width="300" height="130" rx="18" fill="url(#platform)"/>
    <text x="500" y="605" class="box-title">Argo CD + Helm</text>
    <text x="500" y="633" class="box-text">gitops/ and k8s/helm/</text>
    <text x="500" y="659" class="box-text">Desired state in Git</text>
  </g>
  <path d="M340 260 C390 260 410 260 464 260" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M620 331 L620 374" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M620 516 L620 559" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <g filter="url(#shadow)">
    <rect x="900" y="195" width="400" height="315" rx="22" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
    <text x="935" y="238" class="box-title">AWS EKS / Kubernetes</text>
    <rect x="930" y="265" width="155" height="82" rx="14" fill="#164e63"/>
    <text x="950" y="299" class="box-title" font-size="16">Ingress</text>
    <text x="950" y="323" class="box-text">Frontend + /api</text>
    <rect x="1110" y="265" width="155" height="82" rx="14" fill="#164e63"/>
    <text x="1130" y="299" class="box-title" font-size="16">Deployments</text>
    <text x="1130" y="323" class="box-text">React + API</text>
    <rect x="930" y="370" width="335" height="94" rx="14" fill="#164e63"/>
    <text x="950" y="405" class="box-title" font-size="16">MongoDB Community Operator</text>
    <text x="950" y="431" class="box-text">MongoDB instance + service</text>
  </g>
  <path d="M770 630 C840 630 850 350 894 350" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <g filter="url(#shadow)">
    <rect x="900" y="565" width="190" height="130" rx="18" fill="url(#security)"/>
    <text x="930" y="605" class="box-title">AWS Secrets</text>
    <text x="930" y="633" class="box-text">Secrets Manager</text>
    <text x="930" y="659" class="box-text">Mongo credentials</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1110" y="565" width="190" height="130" rx="18" fill="#475569"/>
    <text x="1140" y="605" class="box-title">Terraform</text>
    <text x="1140" y="633" class="box-text">VPC, EKS, ALB, ECR</text>
    <text x="1140" y="659" class="box-text">container-env/terraform/</text>
  </g>
  <path d="M1095 630 L1104 630" fill="none" stroke="#fcd34d" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <path d="M1000 516 L1000 559" fill="none" stroke="#fcd34d" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <path d="M1205 516 L1205 559" fill="none" stroke="#fcd34d" stroke-width="3" marker-end="url(#arrow-amber)"/>

  <rect x="70" y="755" width="700" height="78" rx="18" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <text x="100" y="788" class="box-title">Local development</text>
  <text x="100" y="813" class="box-text">Vite + .NET (in-memory)  •  docker compose → MongoDB</text>

  <line x1="900" y1="770" x2="940" y2="770" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="955" y="775" class="legend">application / build flow</text>
  <line x1="900" y1="805" x2="940" y2="805" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="955" y="810" class="legend">deployment flow</text>
  <line x1="1120" y1="770" x2="1160" y2="770" stroke="#fcd34d" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="1175" y="775" class="legend">platform / secrets</text>
</svg>
