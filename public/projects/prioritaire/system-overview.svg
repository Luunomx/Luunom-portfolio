<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc">
  <title id="title">Prioritaire sanitized system overview</title>
  <desc id="desc">A sanitized, interview-safe overview of a logistics booking and operations application, from authenticated users through the backend, external logistics systems, delivery control plane and AWS runtime. It contains no secrets, live data or private endpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="identity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="integration" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="security" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#fcd34d"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .section { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; letter-spacing: 1.5px; }
      .box-title { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .box-text { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #dbeafe; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .flow-label { stroke: #0f172a; stroke-width: 3px; stroke-linejoin: round; paint-order: stroke fill; }
      .legend { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; }
      .chip { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #a5f3fc; letter-spacing: .8px; }
    </style>
  </defs>

  <rect width="1500" height="1020" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="100" r="250" fill="#4f46e5" opacity=".12"/>
  <circle cx="120" cy="900" r="280" fill="#0891b2" opacity=".10"/>

  <text x="70" y="72" class="title">Prioritaire system overview</text>
  <text x="70" y="104" class="subtitle">A sanitized client system from authenticated mobile request to AWS-hosted logistics operations.</text>
  <g>
    <rect x="1110" y="48" width="320" height="56" rx="14" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <text x="1130" y="72" class="chip">INTERVIEW-SAFE · SANITIZED VIEW</text>
    <text x="1130" y="92" class="small">No secrets, live data or private endpoints</text>
  </g>

  <text x="70" y="164" class="section">APPLICATION</text>
  <text x="500" y="164" class="section">DOMAIN / DELIVERY</text>
  <text x="980" y="164" class="section">RUNTIME / AWS</text>

  <g filter="url(#shadow)">
    <rect x="70" y="195" width="330" height="145" rx="18" fill="url(#app)"/>
    <text x="100" y="235" class="box-title">Company users + Expo</text>
    <text x="100" y="264" class="box-text">Bookers, admins and internal roles</text>
    <text x="100" y="291" class="box-text">React Native booking and order UI</text>
    <text x="100" y="318" class="box-text">Authenticated session and user actions</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="380" width="330" height="165" rx="18" fill="url(#identity)"/>
    <text x="100" y="420" class="box-title">Firebase Auth</text>
    <text x="100" y="449" class="box-text">User identity and ID token lifecycle</text>
    <text x="100" y="476" class="box-text">Company profile scope</text>
    <text x="100" y="503" class="box-text">Session and access context</text>
    <text x="100" y="530" class="box-text">Tenant-aware user experience</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="585" width="330" height="165" rx="18" fill="url(#platform)"/>
    <text x="100" y="625" class="box-title">ASP.NET Core API</text>
    <text x="100" y="654" class="box-text">Verify token and validate request</text>
    <text x="100" y="681" class="box-text">Booking, pricing and order flows</text>
    <text x="100" y="708" class="box-text">Admin reads and status handling</text>
    <text x="100" y="735" class="box-text">Health checks and rate limits</text>
  </g>
  <path d="M235 345 L235 374" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="253" y="365" class="small">identity</text>

  <g filter="url(#shadow)">
    <rect x="500" y="195" width="400" height="180" rx="18" fill="url(#platform)"/>
    <text x="530" y="235" class="box-title">Domain and API layer</text>
    <text x="530" y="264" class="box-text">Booking decision and pricing flow</text>
    <text x="530" y="291" class="box-text">Validation, order state and read models</text>
    <text x="530" y="318" class="box-text">Webhook and tracking orchestration</text>
    <text x="530" y="345" class="box-text">Business rules behind API controllers</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="500" y="395" width="400" height="130" rx="18" fill="url(#integration)"/>
    <text x="530" y="435" class="box-title">External logistics systems</text>
    <text x="530" y="464" class="box-text">Order, price and carrier integrations</text>
    <text x="530" y="491" class="box-text">Status and webhook synchronization</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="500" y="570" width="400" height="180" rx="18" fill="#334155"/>
    <text x="530" y="610" class="box-title">Delivery control plane</text>
    <text x="530" y="639" class="box-text">App source, Dockerfiles and EF migrations</text>
    <text x="530" y="666" class="box-text">GitHub Actions: validate, test, build, push</text>
    <text x="530" y="693" class="box-text">Terraform: RDS, App Runner, S3 and bootstrap</text>
    <text x="530" y="720" class="box-text">Environment-gated schema and releases</text>
  </g>
  <path d="M400 267 C440 267 455 267 494 267" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M700 381 L700 384" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M700 531 L700 559" fill="none" stroke="#fcd34d" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="414" y="252" class="small flow-label">authenticated request</text>
  <text x="716" y="376" class="small">integration call</text>
  <text x="716" y="551" class="small">release path</text>

  <g filter="url(#shadow)">
    <rect x="980" y="185" width="450" height="600" rx="22" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="1015" y="228" class="box-title">AWS runtime boundary</text>
    <text x="1250" y="228" class="chip">CLOUD RUNTIME</text>

    <rect x="1015" y="245" width="380" height="42" rx="12" fill="#0f3f52"/>
    <text x="1035" y="272" class="box-title" font-size="15">Managed container runtime / private data access</text>

    <rect x="1015" y="315" width="185" height="100" rx="14" fill="#164e63"/>
    <text x="1035" y="351" class="box-title" font-size="16">Edge + frontend</text>
    <text x="1035" y="378" class="box-text">CloudFront / WAF</text>
    <text x="1035" y="399" class="box-text">Frontend App Runner</text>

    <rect x="1225" y="315" width="170" height="100" rx="14" fill="#164e63"/>
    <text x="1245" y="351" class="box-title" font-size="16">Backend</text>
    <text x="1245" y="378" class="box-text">App Runner</text>
    <text x="1245" y="399" class="box-text">ECR image + API</text>
    <path d="M1205 365 L1218 365" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-teal)"/>

    <rect x="1015" y="440" width="380" height="95" rx="14" fill="#312e81"/>
    <text x="1035" y="476" class="box-title" font-size="16">Databases and storage</text>
    <text x="1035" y="503" class="box-text">RDS PostgreSQL + S3/object storage</text>
    <text x="1035" y="524" class="box-text">private data access and persistence</text>

    <rect x="1015" y="560" width="185" height="125" rx="14" fill="#3f1d26"/>
    <text x="1035" y="596" class="box-title" font-size="16">Secrets + config</text>
    <text x="1035" y="623" class="box-text">Secrets Manager refs</text>
    <text x="1035" y="644" class="box-text">no values in repo/state</text>

    <rect x="1225" y="560" width="170" height="125" rx="14" fill="#451a03"/>
    <text x="1245" y="596" class="box-title" font-size="16">Observability</text>
    <text x="1245" y="623" class="box-text">CloudWatch logs</text>
    <text x="1245" y="644" class="box-text">alarms + OTel path</text>
    <text x="1245" y="665" class="box-text">environment signals</text>

    <rect x="1015" y="700" width="380" height="60" rx="14" fill="#164e63"/>
    <text x="1035" y="728" class="box-title" font-size="16">Dev/prod boundaries + gated changes</text>
    <text x="1035" y="750" class="box-text">schema, releases and operational configuration</text>
  </g>
  <path d="M900 660 C940 660 950 272 1009 266" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M900 460 C940 450 975 300 1030 300 C1090 300 1155 300 1180 300 C1205 300 1215 315 1219 330" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-amber)"/>
  <text x="912" y="456" class="small flow-label">deploy / integrate</text>

  <g filter="url(#shadow)">
    <rect x="980" y="825" width="210" height="115" rx="18" fill="url(#security)"/>
    <text x="1010" y="865" class="box-title">AWS Secrets</text>
    <text x="1010" y="894" class="box-text">Secrets Manager</text>
    <text x="1010" y="921" class="box-text">externalized config</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1220" y="825" width="210" height="115" rx="18" fill="#475569"/>
    <text x="1250" y="865" class="box-title">Terraform</text>
    <text x="1250" y="894" class="box-text">AWS resources + IAM</text>
    <text x="1250" y="921" class="box-text">environment boundaries</text>
  </g>
  <path d="M1085 817 L1085 795" fill="none" stroke="#fcd34d" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="1100" y="806" class="small">secret wiring</text>
  <path d="M1325 817 L1325 795" fill="none" stroke="#fcd34d" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="1338" y="806" class="small">provisions</text>

  <rect x="70" y="825" width="830" height="115" rx="18" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <text x="100" y="863" class="box-title">What this sanitized view covers</text>
  <text x="100" y="892" class="box-text">Authenticated mobile request → controlled backend → logistics systems</text>
  <text x="100" y="919" class="box-text">CI/CD + Terraform → AWS runtime, data, secrets and observability</text>

  <line x1="980" y1="975" x2="1020" y2="975" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="1035" y="980" class="legend">application / request flow</text>
  <line x1="1190" y1="975" x2="1230" y2="975" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="1245" y="980" class="legend">runtime / integration flow</text>
  <line x1="980" y1="1005" x2="1020" y2="1005" stroke="#fcd34d" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="1035" y="1010" class="legend">delivery / infrastructure</text>
</svg>
